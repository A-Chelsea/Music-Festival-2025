<!DOCTYPE html> 
<html lang="en-GB">
<head>
     <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0 ">
    <title>Music Fest 2025 - Tickets</title>
    <link rel="stylesheet" href="/css/style.css">
     <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <header class="hero-section lineup-hero">
        <nav class="main-nav">
            <div class="logo">MUSIC FEST 2025</div>
            <ul class="nav-links">
                <li><a href="/html/index.html">Home</a></li>
                <li><a href="/html/lineup.html" class="active">Lineup</a></li>
                <li><a href="schedule.html"> Schedule</a></li>
                <li><a href="tickets.html" class="btn-ticket-nav"> Buy Tickets</a></li>
            </ul>
        </nav>

        <div class="hero-content">
            <h1>SECURE YOUR SPOT</h1>
            <p class="theme-desc">Don't miss out on the biggest Afro-Amapiano festival of the year.</p>
        </div>
    </header>

    <main>
        <section class="container form-section">
            <div class="ticket-card">
                <h2>Booking Details</h2>
                <p class="form-instruction"> Please fill out the form below to reserve your ticket.</p>

                <form id="bookingForm" action="#" method="POST">
                    <div class="form-group">
                        <label for="fullName">Full Name:</label>
                        <input type="text" id="fullName" name="fullName" placeholder="e.g. Adam Sandler" required>
                    </div>

                    <div class="form-group">
                         <label for="email">Email Address:</label>
                         <input type="email" id="email" name="email" placeholder="e.g. adamsandler@example.com" required>
                    </div>

                    <div class="form-group">
                         <label for="phone">Phone Number:</label>
                         <input type="tel" id="phone" name="phone" placeholder="e.g. 07700 900000" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="ticketType">Ticket Type:</label>
                            <select id="ticketType" name="ticketType" required>
                                <option value="" disabled selected>Select an option</option>
                                <option value="vip">VIP (Front Row)</option>
                                <option value="premium">Premium (Backstage Access)</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="ticketQuantity">Number of Tickets:</label>
                            <input type="number" id="ticketQuantity" name="ticketQuantity" min="1" max="10" value="1" required>
                        </div> 
                    </div>

                    <div class="form-group">
                            <label for="PaymentMethod">Payment Method:</label>
                            <select id="PaymentMethod" name="PaymentMethod" required>
                                <option value="" disabled selected>Select a Payment Method</option>
                                <option value="credit">Credit Card</option>
                                <option value="debit">Debit Card </option>
                                <option value="paypal">PayPal</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="specialReq">Special Requirements (Optional):</label>
                            <textarea id="specialReq" name="specialReq" rows="4" placeholder="Accessibility needs, dietary restrictions, etc."></textarea> 
                        </div>

                        <div class="form-group checkbox-group">
                             <input type="checkbox" id="terms" name="terms" required>
                             <label for="terms">I agree to the <a href="#">Terms and Conditions</a></label>
                        </div>

                        <div class="form-actions">
                             <button type="submit" class="btn-main-cta submit-btn">Confirm Booking</button>
                             <button type="reset" class="btn-reset">Reset Form</button>
                        </div>

                        <div id="formMessage"></div>

                </form>
            </div>
        </section>
    </main>

    <footer>
        <div class="social-links">
            <a href="#">Instagram </a> | <a href="#">Twitter</a>
            <p>&copy;2025 Music Fest. All Rights Reserved</p>

        </div>
    </footer>
    <script src="/javascript/tickets.js"></script>



</body>
</html>
